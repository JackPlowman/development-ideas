name: Clean Caches

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  clean-caches:
    name: Clean Caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # Allow deletion of this repository's Actions caches
    steps:
      - name: Delete caches
        run: gh cache delete --all --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
